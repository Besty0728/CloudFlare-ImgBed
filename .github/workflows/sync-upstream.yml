name: Upstream Sync

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Step 1: run a standard checkout action
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Step 2: verify SYNC_TOKEN has workflow scope (required to update workflow files)
      - name: Check SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not set or is empty. To sync workflow file changes from upstream, create a Personal Access Token (classic) with 'repo' and 'workflow' scopes and add it as the SYNC_TOKEN repository secret."
            exit 1
          fi

          SCOPES=$(curl -sI -H "Authorization: Bearer ${SYNC_TOKEN}" https://api.github.com/ | grep -i '^x-oauth-scopes:' | sed 's/X-OAuth-Scopes: //i' | tr ',' '\n' | tr -d ' ')
          echo "SYNC_TOKEN scopes:"
          echo "$SCOPES"
          if ! echo "$SCOPES" | grep -qx 'workflow'; then
            echo "::error::SYNC_TOKEN does not have the required 'workflow' scope. Please create a new Personal Access Token (classic) with at least 'repo' and 'workflow' scopes, then update the SYNC_TOKEN repository secret. Fine-grained PATs cannot be used for this."
            exit 1
          fi

      # Step 3: run the sync action
      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: MarSeventh/CloudFlare-ImgBed
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.SYNC_TOKEN }} # Must be a classic PAT with 'repo' + 'workflow' scopes
          upstream_pull_args: -X theirs # Auto-resolve merge conflicts by preferring upstream changes

          # Set test_mode true to run tests instead of the true action!!
          test_mode: false

      - name: Trigger Worker deploy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-worker.yml --repo "${{ github.repository }}" --ref main

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 自动同步失败。请检查上游同步步骤日志（例如是否存在未能自动处理的冲突或 Token 权限问题），然后手动同步一次。"
          echo "[Error] Upstream auto-sync failed. Please check the sync step logs (for unresolved conflicts or token scope issues), then perform one manual sync."
          exit 1
