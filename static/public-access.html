<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImgBed 公开访问管理</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            background-color: #f5f7fa;
            color: #2c3e50;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            color: #409eff;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            border-color: #409eff;
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
        }

        button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-public {
            background-color: #67c23a;
            color: white;
        }

        .btn-private {
            background-color: #909399;
            color: white;
        }

        #status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 4px;
            display: none;
        }

        .success {
            background-color: #f0f9eb;
            color: #67c23a;
        }

        .error {
            background-color: #fef0f0;
            color: #f56c6c;
        }

        .help-text {
            font-size: 0.85rem;
            color: #909399;
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>公开访问文件管理</h1>

        <div class="form-group">
            <label>管理员认证 (Basic Auth)</label>
            <input type="text" id="username" placeholder="用户名" style="margin-bottom: 0.5rem;">
            <input type="password" id="password" placeholder="密码">
            <div class="help-text">首次使用请输入管理员账号密码。浏览器通常会记住这些信息。</div>
        </div>

        <div class="form-group">
            <label>文件路经 (Path) 或 ID</label>
            <input type="text" id="filePath" placeholder="例如: CF/123.jpg 或 123.jpg">
            <div class="help-text">请复制 Dashboard 图片链接中的路径部分。</div>
        </div>

        <div class="btn-group">
            <button onclick="setAccess(true)" class="btn-public">设为公开 (Public)</button>
            <button onclick="setAccess(false)" class="btn-private">设为私有 (Private)</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const API_BASE = '/api/manage';

        // 尝试加载保存的认证信息
        window.onload = () => {
            const auth = localStorage.getItem('imgbed_admin_auth_ui');
            if (auth) {
                const [u, p] = atob(auth).split(':');
                document.getElementById('username').value = u;
                document.getElementById('password').value = p;
            }
        };

        async function setAccess(isPublic) {
            const filePath = document.getElementById('filePath').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const statusEl = document.getElementById('status');

            if (!filePath) {
                showStatus('请输入文件路径', 'error');
                return;
            }
            if (!username || !password) {
                showStatus('请输入管理员用户名和密码', 'error');
                return;
            }

            // 保存认证信息
            const authStr = `${username}:${password}`;
            const token = btoa(authStr);
            localStorage.setItem('imgbed_admin_auth_ui', token);

            showStatus('处理中...', 'info');

            try {
                const endpoint = isPublic ? 'public' : 'unpublic';
                // 自动处理路径前缀，如果是完整URL尝试提取，如果只是文件名尝试猜测
                // 这里假设用户输入的是 API 期望的格式

                const response = await fetch(`${API_BASE}/${endpoint}/${encodeURIComponent(filePath)}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Basic ${token}`
                    }
                });

                if (response.ok) {
                    showStatus(
                        isPublic ? `✅ 成功！文件现已公开访问（无视防盗链）。` : `🔒 成功！文件已恢复为私有状态。`,
                        'success'
                    );
                } else {
                    const text = await response.text();
                    showStatus(`❌ 失败: ${response.status} ${text}`, 'error');
                }
            } catch (err) {
                console.error(err);
                showStatus(`❌ 网络错误: ${err.message}`, 'error');
            }
        }

        function showStatus(text, type) {
            const el = document.getElementById('status');
            el.style.display = 'block';
            el.className = type === 'info' ? '' : type;
            el.style.backgroundColor = type === 'info' ? '#ecf5ff' : null;
            el.style.color = type === 'info' ? '#409eff' : null;
            el.textContent = text;
        }
    </script>
</body>

</html>
